<!-- =========================
        HERO TEMPORADA
        DÍA DEL PADRE
========================= -->
 <link rel="stylesheet" href="/src/styles/fathers-day.css">

<section class="season-hero fathersday-hero">

    <!-- OVERLAY -->
    <div class="season-hero-overlay"></div>

    <div class="container position-relative">

        <div class="row align-items-center min-vh-100">

            <!-- TEXTO -->
            <div class="col-lg-6">

                <span class="season-label fathersday-label">
                    COLECCIÓN ESPECIAL
                </span>

                <h1 class="season-hero-title fathersday-title">
                    Día del Padre
                </h1>

                <p class="season-hero-description fathersday-description">
                    Diseños artesanales creados para celebrar
                    a papá con detalles únicos, elegantes
                    y hechos para recordar.
                </p>

                <!-- BOTONES -->
                <div class="season-hero-buttons">

                    <a href="#coleccion" class="btn-season-primary fathersday-primary">
                        Ver colección
                    </a>

                    <a href="#" class="btn-season-secondary fathersday-secondary">
                        Contactar
                    </a>

                </div>

            </div>

            <!-- IMAGENES SLIDER -->
            <div class="col-lg-6">

                <div id="fathersCarousel" 
                    class="carousel slide season-carousel"
                    data-bs-ride="carousel">

                    <!-- INDICADORES -->
                    <div class="carousel-indicators">

                        <button 
                            type="button"
                            data-bs-target="#fathersCarousel"
                            data-bs-slide-to="0"
                            class="active">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#fathersCarousel"
                            data-bs-slide-to="1">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#fathersCarousel"
                            data-bs-slide-to="2">
                        </button>

                    </div>

                    <!-- SLIDES -->
                    <div class="carousel-inner season-carousel-inner">

                        <!-- SLIDE 1 -->
                        <div class="carousel-item active">

                            <img 
                                src="src/images/seasons/fathersday-1.webp"
                                class="season-hero-image"
                                alt="Día del Padre">

                        </div>

                        <!-- SLIDE 2 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/fathersday-2.webp"
                                class="season-hero-image"
                                alt="Colección Papá">

                        </div>

                        <!-- SLIDE 3 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/fathersday-3.webp"
                                class="season-hero-image"
                                alt="Regalos personalizados">

                        </div>

                    </div>

                    <!-- CONTROLES -->
                    <button 
                        class="carousel-control-prev"
                        type="button"
                        data-bs-target="#fathersCarousel"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                    </button>

                    <button 
                        class="carousel-control-next"
                        type="button"
                        data-bs-target="#fathersCarousel"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- EFECTOS DECORATIVOS -->
    <div class="season-blur fathersday-blur-1"></div>
    <div class="season-blur fathersday-blur-2"></div>

</section>
