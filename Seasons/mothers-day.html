<!-- =========================
        HERO TEMPORADA
        DÍA DE LAS MADRES
========================= -->
 <link rel="stylesheet" href="/src/styles/mothers-day.css">

<section class="season-hero mothersday-hero">

    <!-- OVERLAY -->
    <div class="season-hero-overlay"></div>

    <div class="container position-relative">

        <div class="row align-items-center min-vh-100">

            <!-- TEXTO -->
            <div class="col-lg-6">

                <span class="season-label mothersday-label">
                    COLECCIÓN ESPECIAL
                </span>

                <h1 class="season-hero-title mothersday-title">
                    Día de las Madres
                </h1>

                <p class="season-hero-description mothersday-description">
                    Regalos artesanales creados para celebrar
                    el amor, la dedicación y los momentos
                    inolvidables junto a mamá.
                </p>

                <!-- BOTONES -->
                <div class="season-hero-buttons">

                    <a href="#coleccion" class="btn-season-primary mothersday-primary">
                        Ver colección
                    </a>

                    <a href="#" class="btn-season-secondary mothersday-secondary">
                        Contactar
                    </a>

                </div>

            </div>

            <!-- IMAGENES SLIDER -->
            <div class="col-lg-6">

                <div id="mothersCarousel" 
                    class="carousel slide season-carousel"
                    data-bs-ride="carousel">

                    <!-- INDICADORES -->
                    <div class="carousel-indicators">

                        <button 
                            type="button"
                            data-bs-target="#mothersCarousel"
                            data-bs-slide-to="0"
                            class="active">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#mothersCarousel"
                            data-bs-slide-to="1">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#mothersCarousel"
                            data-bs-slide-to="2">
                        </button>

                    </div>

                    <!-- SLIDES -->
                    <div class="carousel-inner season-carousel-inner">

                        <!-- SLIDE 1 -->
                        <div class="carousel-item active">

                            <img 
                                src="src/images/seasons/mothersday-1.webp"
                                class="season-hero-image"
                                alt="Día de las Madres">

                        </div>

                        <!-- SLIDE 2 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/mothersday-2.webp"
                                class="season-hero-image"
                                alt="Colección Mamá">

                        </div>

                        <!-- SLIDE 3 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/mothersday-3.webp"
                                class="season-hero-image"
                                alt="Regalos personalizados">

                        </div>

                    </div>

                    <!-- CONTROLES -->
                    <button 
                        class="carousel-control-prev"
                        type="button"
                        data-bs-target="#mothersCarousel"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                    </button>

                    <button 
                        class="carousel-control-next"
                        type="button"
                        data-bs-target="#mothersCarousel"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- EFECTOS DECORATIVOS -->
    <div class="season-blur mothersday-blur-1"></div>
    <div class="season-blur mothersday-blur-2"></div>

</section>
