<!-- =========================
        HERO TEMPORADA
            NAVIDAD
========================= -->
 <link rel="stylesheet" href="/src/styles/navidad.css">

<section class="season-hero christmas-hero">

    <!-- OVERLAY -->
    <div class="season-hero-overlay"></div>

    <div class="container position-relative">

        <div class="row align-items-center min-vh-100">

            <!-- TEXTO -->
            <div class="col-lg-6">

                <span class="season-label christmas-label">
                    COLECCIÓN ESPECIAL
                </span>

                <h1 class="season-hero-title christmas-title">
                    Navidad
                </h1>

                <p class="season-hero-description christmas-description">
                    Decoraciones y regalos artesanales creados
                    para llenar cada espacio de magia,
                    calidez y espíritu navideño.
                </p>

                <!-- BOTONES -->
                <div class="season-hero-buttons">

                    <a href="#coleccion" class="btn-season-primary christmas-primary">
                        Ver colección
                    </a>

                    <a href="#" class="btn-season-secondary christmas-secondary">
                        Contactar
                    </a>

                </div>

            </div>

            <!-- IMAGENES SLIDER -->
            <div class="col-lg-6">

                <div id="christmasCarousel" 
                    class="carousel slide season-carousel"
                    data-bs-ride="carousel">

                    <!-- INDICADORES -->
                    <div class="carousel-indicators">

                        <button 
                            type="button"
                            data-bs-target="#christmasCarousel"
                            data-bs-slide-to="0"
                            class="active">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#christmasCarousel"
                            data-bs-slide-to="1">
                        </button>

                        <button 
                            type="button"
                            data-bs-target="#christmasCarousel"
                            data-bs-slide-to="2">
                        </button>

                    </div>

                    <!-- SLIDES -->
                    <div class="carousel-inner season-carousel-inner">

                        <!-- SLIDE 1 -->
                        <div class="carousel-item active">

                            <img 
                                src="src/images/seasons/christmas-1.webp"
                                class="season-hero-image"
                                alt="Navidad">

                        </div>

                        <!-- SLIDE 2 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/christmas-2.webp"
                                class="season-hero-image"
                                alt="Decoración Navideña">

                        </div>

                        <!-- SLIDE 3 -->
                        <div class="carousel-item">

                            <img 
                                src="src/images/seasons/christmas-3.webp"
                                class="season-hero-image"
                                alt="Colección Navideña">

                        </div>

                    </div>

                    <!-- CONTROLES -->
                    <button 
                        class="carousel-control-prev"
                        type="button"
                        data-bs-target="#christmasCarousel"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                    </button>

                    <button 
                        class="carousel-control-next"
                        type="button"
                        data-bs-target="#christmasCarousel"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- EFECTOS DECORATIVOS -->
    <div class="season-blur christmas-blur-1"></div>
    <div class="season-blur christmas-blur-2"></div>

</section>
