<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | Maderarte</title>
    <meta name="description" content="Contáctanos para obtener más información sobre nuestros productos y servicios. Proveedores de mobiliario para mesa de dulces, cajas de madera y MDF para centros de mesa, recuerdos y regalos. Atención personalizada y precios de mayoreo.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/src/styles/contact-us.css">
</head>

<body class="bg-color-base">

    <div id="header-placeholder"></div>

    <!-- ==========================================
         SECCIÓN 1: IMAGEN (Izquierda) Y TEXTO (Derecha) 
         ========================================== -->
    <!-- container-fluid y p-0 hacen que el contenedor ocupe el 100% del ancho sin bordes -->
    <section class="container-fluid p-0 bg-color-base">
        <!-- g-0 quita los espacios entre columnas. min-vh-100 hace que ocupe al menos toda la altura de la pantalla -->
        <div class="row g-0 min-vh-100">

            <!-- MITAD IZQUIERDA: IMAGEN -->
            <div class="col-md-6">
                <!-- img-fluid hace que la imagen no se desborde. w-100 y h-100 hacen que llene la columna -->
                <!-- El object-fit: cover en línea asegura que la imagen no se deforme -->
                <img src="/src/images/contact-us/taller-prueba.webp" alt="Taller de madera MDF"
                    class="img-fluid w-100 h-100" style="object-fit: cover;">
            </div>

            <!-- MITAD DERECHA: TEXTO Y WHATSAPP -->
            <!-- d-flex y align-items-center centran el contenido verticalmente. p-5 da un espaciado interior grande -->
            <div class="col-md-6 d-flex align-items-center p-5">
                <div>
                    <!-- Reemplazamos el h4 por un span semántico -->
                    <span class="text-uppercase text-dark fuente-personalizada">¿Interesado?</span>
                    <!-- display-4 hace el h1 más grande de lo normal. fw-bold le da negrita -->
                    <h1 class="display-4 fw-bold mb-4 mt-1 fuente-personalizada">Contáctanos hoy mismo.</h1>

                    <!-- Contenedor Flex para alinear el icono de WhatsApp y el texto lado a lado -->
                    <span class="text-uppercase text-dark fuente-personalizada">Chatemos por WhatsApp</span>
                    <div class="d-flex align-items-center gap-3 mt-4">
                        <a href="https://wa.me/5212281821259" target="_blank" class="text-decoration-none">
                            <img src="/src/images/contact-us/whatsapp-en-caja.webp" alt="WhatsApp"
                                style="width: 50px; height: 50px;border-radius: 50%;">
                        </a>
                        <a href="https://wa.me/5212281821259" target="_blank" class="text-dark text-decoration-none hover-underline">
                            <p class="mb-0 fs-5 fuente-personalizada">+52 1 228 182 1259</p>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ==========================================
         SECCIÓN 2: FORMULARIO (Izquierda) Y MAPA (Derecha)
         ========================================== -->
    <!-- container normal deja márgenes a los lados para que se vea ordenado. py-5 da padding arriba y abajo -->
    <section class="container py-5 my-5">
        <div class="row align-items-center">

            <!-- MITAD IZQUIERDA: FORMULARIO -->
            <!-- pe-md-5 da un padding extra a la derecha solo en computadoras para separar el form del mapa -->
            <div class="col-md-6 pe-md-5">
                <h2 class="mb-4 fuente-personalizada">¿Quieres contactarnos?</h2>

                <form action="https://formsubmit.co/tu-email-aqui" method="POST">
                    <!-- Cada campo se envuelve en un mb-3 (margin bottom) para separarlos -->
                    <div class="mb-3">
                        <label for="firstName" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="firstName" name="first-name" placeholder="Tu nombre"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="lastName" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="lastName" name="last-name" placeholder="Tu apellido"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email"
                            placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Número de teléfono</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="123456789" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Mensaje</label>
                        <!-- Usamos textarea con filas definidas para que se vea más grande -->
                        <textarea class="form-control" id="message" name="message" rows="4"
                            placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>
                    <!-- w-100 hace que el botón ocupe todo el ancho. btn-dark le da un estilo oscuro base -->
                    <button type="submit" class="btn btn-dark w-100 py-2 mt-3 mi-boton-personalizado">Enviar
                        mensaje</button>
                </form>
            </div>

            <!-- MITAD DERECHA: MAPA -->
            <!-- mt-5 mt-md-0 asegura que en celulares haya espacio arriba del mapa, pero en PC no -->
            <div class="col-md-6 mt-5 mt-md-0">
                <!-- Las clases "ratio" y "ratio-1x1" de Bootstrap hacen que el iframe sea perfectamente responsivo en forma de cuadrado -->
                <div class="ratio ratio-1x1 shadow-sm rounded overflow-hidden">
                    <!-- He quitado el width="600" y height="450" fijos porque la clase ratio lo controla -->
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3760.172255187516!2d-96.938463!3d19.534216900000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85db2f9e92a08cc7%3A0x4ef887b90836dc2d!2sMaderarte%20Xalapa!5e0!3m2!1ses-419!2smx!4v1779906915766!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>

        </div>
    </section>

    <div id="footer-placeholder"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="/src/js/main.js"></script>
</body>

</html>
